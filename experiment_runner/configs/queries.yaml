  - id: q28
    class_name: join
    task_name: external_knowledge
    nlq: "Player went to College."

    table_left: datasets/nba/join_tables/player_college/case_2/players.csv
    cols_left: [player_name]
    left_key: player_name

    table_right: datasets/nba/join_tables/player_college/case_2/colleges.csv
    cols_right: [college]
