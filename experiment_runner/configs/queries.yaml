queries:
  - id: q1
    class_name: derivation
    task_name: classification
    nlq: "Which team won the game described in the summary: home or visitor?"
    table: datasets/nba/game_summaries.csv
    cols: [summary]
    new_col_name: winner
    new_col_type: str
    lotus_query: "Which team won the game described in the {summary}? Return only *home* or *visitor*."
    palimpzest_query: "Which team won the game described in the `summary`? Return only *home* or *visitor*."
    blendsql_query: "Which team won the game described in the {summary}? Return only *home* or *visitor*."
    evaluation_cols: [sportsett_id, summary, win_home_or_vis]

  - id: q2
    class_name: derivation
    task_name: reasoning
    nlq: "Return points scored by the winner team"
    table: datasets/nba/game_summaries.csv
    cols: [summary]
    lotus_query: "Return points scored by the winner team in the game described in the {summary}. Return only the number of points."
    new_col_name: winner_points
    new_col_type: int
    palimpzest_query: "Return points scored by the winner team in the game described in the `summary`. Return only the number of points."
    blendsql_query: "Return points scored by the winner team in the game described in the {summary}. Return only the number of points."
    evaluation_cols: [sportsett_id, summary, winner_points]

  - id: q3
    class_name: derivation
    task_name: extraction
    nlq: "Return points scored by a specific player mentioned in a game summary"
    table: datasets/nba/players_summaries.csv
    cols: [player_name, summary]
    lotus_query: "Return points scored by {player_name} in the game described in the {summary}. Return only the number of points."
    new_col_name: player_points
    new_col_type: int
    palimpzest_query: "Return points scored by `player_name` in the game described in the `summary`. Return only the number of points."
    blendsql_query: "Return points scored by {player_name} in the game described in the {summary}. Return only the number of points."
    evaluation_cols: [sportsett_id, player_name, summary, points]

  - id: q4
    class_name: derivation
    task_name: external_knowledge
    nlq: "Return the birthplace of a specific player"
    table: datasets/nba/all_seasons.csv
    cols: [player_name]
    lotus_query: "Return the birthplace of {player_name}. Return only the name of the country."
    new_col_name: birthplace
    new_col_type: str
    palimpzest_query: "Return the birthplace of `player_name`. Return only the name of the country."
    blendsql_query: "Return the birthplace of {player_name}. Return only the name of the country."
    evaluation_cols: [player_name, country]

  - id: q5
    class_name: selection
    task_name: classification
    nlq: "Did the team win the game?"
    table: datasets/nba/teams_summaries.csv
    cols: [team, summary]
    filtering_col: is_winner
    lotus_query: "The {team} won the game described by {summary}."
    palimpzest_query: "The `team` won the game described by `summary`."
    evaluation_cols: [team, summary, is_winner]

  - id: q6
    class_name: selection
    task_name: reasoning
    nlq: "The total points (sum) scored by both teams played in the game is greater than 180?"
    table: datasets/nba/game_summaries.csv
    cols: [summary]
    filtering_col: total_points_gt_180
    lotus_query: "The total points (sum) scored by both teams played in the game described by {summary} is greater than 180."
    palimpzest_query: "The total points (sum) scored by both teams played in the game described by `summary` is greater than 180."
    evaluation_cols: [summary, total_points_gt_180]

  - id: q7
    class_name: selection
    task_name: external_knowledge
    nlq: "The player's height is less than 190cm."
    table: datasets/nba/all_seasons_cleaned.csv
    cols: [player_name]
    filtering_col: height_lt_190
    lotus_query: "The height of {player_name} is less than 190cm."
    palimpzest_query: "The height of `player_name` is less than 190cm."
    evaluation_cols: [player_name, height_lt_190]


  - id: q8
    class_name: join
    task_name: classification
    nlq: "The summary mentions a specific player"
    table_left: datasets/nba/game_summaries.csv
    cols_left: [sportsett_id, summary]
    table_right: datasets/nba/all_seasons_cleaned.csv
    cols_right: [player_name]
    left_key: summary
    right_key: player_name
    lotus_query: "The summary {summary} mentions the player {player_name}."
    blendsql_query: "The summary {summary} mentions the player {player_name}."
    evaluation_table: datasets/nba/players_summaries.csv
    evaluation_cols: [sportsett_id, summary, player_name]

  - id: q9
    class_name: join
    task_name: reasoning
    nlq: "A specific player scored the most points in the game."
    table_left: datasets/nba/game_summaries.csv
    cols_left: [sportsett_id, summary]
    table_right: datasets/nba/players_summaries.csv
    cols_right: [player_name, points]
    left_key: summary
    right_key: player_name
    lotus_query: "The player {player_name} scored the most points in the game described by {summary}."
    blendsql_query: "The player {player_name} scored the most points in the game described by {summary}."
    
  - id: q10
    class_name: join
    task_name: external_knowledge
    nlq: "A specific player went to a specific college."
    table_left: datasets/nba/players_summaries.csv
    cols_left: [player_name]
    table_right: datasets/nba/all_seasons_cleaned.csv
    cols_right: [college]
    left_key: player_name
    right_key: college
    lotus_query: "The player {player_name} went to {college}."
    blendsql_query: "The player {player_name} went to {college}."

  - id: q11
    class_name: aggregation
    task_name: reasoning
    nlq: "Which player had the most triple doubles among all given games?"
    table: datasets/nba/game_summaries.csv
    cols: [summary]
    lotus_query: "Which player had the most triple doubles among all given games described by {summary}? Return only the name of the player."
    blendsql_query: "Which player had the most triple doubles among all given games described by {summary}? Return only the name of the player."
