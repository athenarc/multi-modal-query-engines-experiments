    evalution_cols: [sportsett_id, summary, player_name]

    lotus_query: "The player {player_name} scored the most points in the game described by {summary}."
    blendsql_query: "The player {player_name} scored the most points in the game described by {summary}."

  - id: q26
    class_name: join
    task_name: reasoning
    nlq: "A specific player had the most assists in the game."

    table_left: datasets/nba/join_tables/player_max_assists/case_2/summaries.csv
    cols_left: [sportsett_id, summary]
    left_key: summary

    table_right: datasets/nba/join_tables/player_max_points/case_2/players.csv
    cols_right: [player_name]
    right_key: player_name

    evaluation_table: datasets/nba/join_tables/player_max_assists/case_2/ground_truth.csv
    evaluation_cols: [sportsett_id, summary, player_name]

