# ### ROTTEN TOMATOES CORPUS ###
# DERIVATION QUERIES
  - id: q34
    class_name: derivation
    task_name: classification
    nlq: "Classify the audience suitability based on the given description of a movie as exactly one of: G (general audience), PG (parentla guidance) and R (restricted)."

    quality_table: movies_derivation_curated.csv
    scalability_table: movies_curated.csv
    cols: [rotten_tomatoes_link, movie_title, movie_info]

    new_col_name: audience_suitability
    new_col_type: str

    evaluation_cols: [rotten_tomatoes_link, movie_title, movie_info, content_rating]

    lotus_query: "Classify the audience suitability based on the description {movie_info} of the movie as exactly one of: G (general audience), PG (parental guidance) and R (restricted). Return only G, PG or R."
    palimpzest_query: "Classify the audience suitability based on the description `movie_info` of the movie as exactly one of: G (general audience), PG (parental guidance) and R (restricted). Return only G, PG or R."
    blendsql_query: "Classify the audience suitability based on the description {movie_info} of the movie as exactly one of: G (general audience), PG (parental guidance) and R (restricted). Return only G, PG or R."
 
  - id: q35
    class_name: derivation
    task_name: classification
    nlq: "Decide whether this review recommends the movie, answering either fresh or rotten."

    quality_table: reviews_derivation_curated.csv
    scalability_table: reviews_curated.csv
    cols: [rotten_tomatoes_link, review_content]

    new_col_name: fresh_or_rotten
    new_col_type: str

    evaluation_cols: [rotten_tomatoes_link, review_content, review_type]

    lotus_query: "Decide whether the review {review_content} recommends the movie. Answer exactly one of: Fresh, Rotten."
    palimpzest_query: "Decide whether the review `review_content` recommends the movie. Answer exactly one of: Fresh, Rotten."
    blendsql_query: "Decide whether the review {review_content} recommends the movie. Answer exactly one of: Fresh, Rotten."

  - id: q36
    class_name: derivation
    task_name: classification
    nlq: "Classify the movie's genre based on its description as exactly one of: Drama, Comedy, Action, Horror, Romance, Thriller, Documentary, Animation or Other."

    quality_table: movies_derivation_curated.csv
    scalability_table: movies_curated.csv
    cols: [rotten_tomatoes_link, movie_title, movie_info]

    new_col_name: genre
    new_col_type: str

    evaluation_cols: [rotten_tomatoes_link, movie_title, movie_info, genre]

