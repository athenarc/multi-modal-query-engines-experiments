    blendsql_query: "The player {player_name} had the most assists in the game described by {summary}."

  - id: q27
    class_name: join
    task_name: reasoning
    nlq: "A specific player had the most rebounds in the game."

    table_left: datasets/nba/join_tables/player_max_rebounds/case_2/summaries.csv
    cols_left: [sportsett_id, summary]
