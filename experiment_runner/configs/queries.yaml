    blendsql_query: "The player {player_name} went to {college}."

  - id: q29
    class_name: join
    task_name: external_knowledge
    nlq: "Player was over 22 years old in a specific season."

    table_left: datasets/nba/join_tables/player_over_22/case_2/players.csv
    cols_left: [player_name]
    left_key: player_name

    table_right: datasets/nba/join_tables/player_over_22/case_2/seasons.csv
    cols_right: [season]
    right_key: season

    evaluation_table: datasets/nba/join_tables/player_over_22/case_2/ground_truth.csv
    evaluation_cols: [player_name, season]

    lotus_query: "The player {player_name} was over 22 years old in season {season}."
    blendsql_query: "The player {player_name} was over 22 years old in season {season}."
  
  - id: q30
    class_name: join
    task_name: external_knowledge
    nlq: "Player was born in Country."

    table_left: datasets/nba/join_tables/player_country/case_2/players.csv
    cols_left: [player_name]
    left_key: player_name

    table_right: datasets/nba/join_tables/player_country/case_2/countries.csv
    cols_right: [country]
    right_key: country

    evaluation_table: datasets/nba/join_tables/player_country/case_2/ground_truth.csv
    evaluation_cols: [player_name, country]

    lotus_query: "The player {player_name} was born in {country}."
    blendsql_query: "The player {player_name} was born in {country}."

  - id: q31
    class_name: aggregation
    task_name: reasoning
    nlq: "Which player had the most triple doubles among all given games?"
    table: datasets/nba/game_summaries.csv
    cols: [summary]
    lotus_query: "Which player had the most triple doubles among all given games described by {summary}? Return only the name of the player."
    blendsql_query: "Which player had the most triple doubles among all given games described by {summary}? Return only the name of the player."
